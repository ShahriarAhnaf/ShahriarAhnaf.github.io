<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
<title id="title">What is inside my lil virtual machine?</title>
<desc id="desc">The memory and register arrays are stored data. The while loop, loader, and input/output functions are executable C code. An LC-3 program loads into emulated memory. The C instruction loop reads memory and updates memory, registers, the program counter and condition flags. Input and output connect to the host operating system. The host CPU runs the compiled VM.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" overflow="visible" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#455367" stroke-width="1.3"/></marker></defs>
<rect width="720" height="900" fill="#fff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17202c" text-anchor="middle">
<rect x="185" y="22" width="350" height="76" rx="4" fill="#fff" stroke="#455367" stroke-width="2"/>
<text x="360" y="52" font-size="24">LC-3 program</text><text x="360" y="80" font-size="19">Instructions + data in a file</text>
<rect x="22" y="146" width="676" height="522" rx="6" fill="#f5f7fb" stroke="#455367" stroke-width="2"/>
<text x="360" y="183" font-size="24">My lil virtual machine · written in C</text>
<path d="M360 98 V120 H36 V205 H193 V224" fill="none" stroke="#455367" stroke-width="2" marker-end="url(#arrow)"/>
<text x="518" y="127" font-size="18">Loader code copies the file</text>
<rect x="50" y="224" width="286" height="136" rx="4" fill="#fff" stroke="#455367" stroke-width="1.5"/>
<text x="193" y="254" font-size="23">DATA · Memory array</text><text x="193" y="285" font-size="20">Program instructions</text><text x="193" y="313" font-size="20">+ stored data</text><text x="193" y="341" font-size="18" fill="#526171">65,536 × 16-bit values</text>
<rect x="382" y="224" width="286" height="136" rx="4" fill="#fff" stroke="#455367" stroke-width="1.5"/>
<text x="525" y="254" font-size="23">DATA · Register array</text><text x="525" y="284" font-size="19">R0–R7: working values</text><text x="525" y="313" font-size="19">PC: next instruction address</text><text x="525" y="341" font-size="18">Flags: negative / zero / positive</text>
<path d="M193 360 V424" fill="none" stroke="#455367" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M525 360 V424" fill="none" stroke="#455367" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="360" y="399" font-size="18">Read / update</text>
<rect x="50" y="424" width="618" height="100" rx="4" fill="#eaf0ff" stroke="#3459d5" stroke-width="2"/>
<text x="360" y="457" font-size="24">CODE · while (running)</text><text x="360" y="492" font-size="22">Fetch → Decode → Execute → Repeat</text>
<path d="M360 524 V576" fill="none" stroke="#455367" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="125" y="576" width="470" height="65" rx="4" fill="#eaf0ff" stroke="#3459d5" stroke-width="1.5"/>
<text x="360" y="602" font-size="22">CODE · Input / output functions</text><text x="360" y="627" font-size="19">Keyboard input + terminal output</text>
<path d="M360 641 V730" fill="none" stroke="#455367" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="530" y="705" font-size="18">Through host OS calls</text>
<rect x="22" y="730" width="676" height="138" rx="4" fill="#fff" stroke="#455367" stroke-width="2"/>
<text x="360" y="764" font-size="24">The real computer underneath</text><text x="360" y="802" font-size="21">Host OS: terminal + file access</text><text x="360" y="839" font-size="21">Host CPU: executes the compiled C program</text>
</g></svg>
